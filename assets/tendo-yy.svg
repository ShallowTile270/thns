<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 36" width="132" height="36">
  <!-- Tendo wordmark capsule as a yin-yang: light and dark halves meet in a flowing S-curve that runs between the letters,
       with a dot of the opposite tone in each end. The text on top inverts across it (CSS blend). -->
  <defs><clipPath id="c"><rect width="132" height="36" rx="18"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="132" height="36" fill="#f2f2f4"/>
    <path d="M78 0 C 50 6, 86 30, 56 36 L132 36 L132 0 Z" fill="#1d1d1f"/>
    <circle cx="17" cy="18" r="4" fill="#1d1d1f"/>
    <circle cx="115" cy="18" r="4" fill="#f2f2f4"/>
  </g>
  <rect x=".5" y=".5" width="131" height="35" rx="17.5" fill="none" stroke="#000" stroke-opacity=".25"/>
</svg>
